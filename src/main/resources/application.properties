spring.application.name=backend

# Database Configuration (Aiven MySQL)
# Environment variables DB_URL, DB_USERNAME, DB_PASSWORD take precedence in Render
# Existing Aiven connection details serve as default fallback
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-b185c01-anurag-124a.f.aivencloud.com:14757/campuscomplaint?ssl-mode=REQUIRED}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:avnadmin}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${db_password:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Non-destructive: 'update' preserves existing tables and data)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Port Configuration (Render automatically assigns PORT)
server.port=${PORT:8080}
